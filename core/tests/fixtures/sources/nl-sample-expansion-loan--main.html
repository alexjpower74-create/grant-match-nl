<h1>SAMPLE Expansion Loan</h1>
<p>The SAMPLE Expansion Loan is a loan to help established businesses in Newfoundland and Labrador grow.</p>
<p>Eligible applicants must <em>normally</em> have been in business for at least 3&nbsp;years.</p>
<p>The loan can pay for equipment or new hires.</p>
<p>There is no deadline to apply.</p>
