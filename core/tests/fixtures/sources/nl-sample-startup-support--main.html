<h1>SAMPLE Start&#8209;up Support</h1>
<p>SAMPLE Start-up Support is a repayable contribution for new businesses.</p>
<p>Businesses must be based in Newfoundland and Labrador.</p>
<p>Businesses that have been operating for 24 months or less can apply.</p>
<p>There is no deadline.</p>
