name = "grant-match-nl"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Local only. Nothing here is ever deployed from this repo (see AGENTS.md).
[[d1_databases]]
binding = "DB"
database_name = "grant-match-nl"
database_id = "LOCAL-ONLY-set-at-deploy"
migrations_dir = "migrations"

[triggers]
crons = ["15 10 * * 1"]

[vars]
DATA_SET = "real"
ALLOW_NOW = "0"
SOURCE_ORIGIN_MAP = ""
